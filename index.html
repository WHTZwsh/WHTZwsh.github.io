<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛫 起飞</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<div class="sky" id="sky"></div>
<div id="ground">
  <div class="runway-mark"></div>
  🌳 🏢 🌳 🚗 🌳 🏠 🌳 🛫 🌳 🏢 🌳
</div>
<div id="plane">🛫</div>
<div id="flash"></div>

<div id="hud">
  <div id="phaseName">✈️ 准备就绪</div>
  <div id="phaseDesc">点击按钮，开始你的 10 分钟起飞</div>
  <div id="barWrap"><div id="bar"></div></div>
</div>
<div id="timer">00:00</div>

<div id="controls">
  <button class="btn ghost" id="btnPause">⏸</button>
  <button class="btn ghost" id="btnSkip">直接落地</button>
</div>

<div id="overlay">
  <h1>🛫 起飞</h1>
  <p>一次约 10分钟的起飞体验：<br>
     ① 🐢 缓缓 → ② 🚀 冲刺加速 → ③ ✨ 有感觉了 → ④ 🛬 平稳落地</p>
  <button class="btn" id="btnStart">🛫 开始起飞</button>
</div>

<div id="banner">卤完了<br><span style="font-size:22px;font-weight:400">恭喜机长起飞完成</span></div>

<script src="script.js?v=3"></script>
</body>
</html>
