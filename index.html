<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛫 起飞时刻 · Emoji Flight</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky" id="sky"></div>
<div id="ground">
  <div class="runway-mark"></div>
  🌳 🏢 🌳 🚗 🌳 🏠 🌳 🛫 🌳 🏢 🌳
</div>
<div id="plane">🛫</div>
<div id="flash"></div>

<div id="hud">
  <div id="phaseName">✈️ 准备就绪</div>
  <div id="phaseDesc">点击按钮，开始你的 10 分钟飞行</div>
  <div id="barWrap"><div id="bar"></div></div>
</div>
<div id="timer">00:00</div>

<div id="controls">
  <button class="btn ghost" id="btnPause">⏸ 暂停</button>
  <button class="btn ghost" id="btnSkip">⏭ 直接落地</button>
</div>

<div id="overlay">
  <h1>🛫 起飞时刻</h1>
  <p>一次约 10 分钟的 Emoji 飞行体验：<br>
     ① 🐢 缓缓滑跑 → ② 🚀 全力冲刺 → ③ ✨ 有感觉了 → ④ 🛬 平稳落地</p>
  <button class="btn" id="btnStart">🛫 开始起飞</button>
</div>

<div id="banner">🎉 平稳落地<br><span style="font-size:22px;font-weight:400">感谢乘坐本次 Emoji 航班</span></div>

<script src="script.js"></script>
</body>
</html>
